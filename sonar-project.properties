# Required metadata
sonar.projectKey=DevGate
sonar.projectName=DevGate
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/public/**,**/*.spec.js,**/*.test.js,**/babel.config.js,**/vue.config.js,**/jsconfig.json

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Coverage exclusions
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/assets/**,**/*.config.js,**/*.spec.js,**/*.test.js

# File patterns
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx,.vue

# Vue.js specific settings
sonar.scm.provider=git
